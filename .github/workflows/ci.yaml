name: Continuous integration

on:
  push:
    branches: [ main ]
  pull_request: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          run_install: true

      - name: Check all
        run: pnpm run check

  tag:
    name: Tag
    needs: check
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Get version
        id: get-version
        run: |
          version=v$(sed -En 's/ *"version": "([0-9.]+)",/\1/p' package.json)
          create_release=$(git ls-remote --exit-code --tags origin $version && echo false || echo true)

          echo version=$version >> "$GITHUB_OUTPUT"
          echo create-release=$create_release >> "$GITHUB_OUTPUT"

      - name: Install pnpm
        if: steps.get-version.outputs.create-release == 'true'
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          run_install: true

      - name: Package release
        if: steps.get-version.outputs.create-release == 'true'
        run: pnpm run package-vsix

      - name: Create release
        if: steps.get-version.outputs.create-release == 'true'
        run: |
          gh release create $tag \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Dumb Links $tag" \
            *.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.get-version.outputs.version }}
